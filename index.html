<div id="splash" role="presentation">
  <div class="sp-in">
    <div class="sp-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="sp-word" aria-label="Luzichik"><span>L</span><span>U</span><span>Z</span><span>I</span><span>C</span><span>H</span><span>I</span><span>K</span></div>
    <div class="sp-line" aria-hidden="true"></div>
    <div class="sp-sub" id="sp-sub">DUS Sınavı Testleri</div>
  </div>
</div>
<script>
/* Açılış animasyonu: oturumda bir kez gösterilir, dokununca geçilir. */
(function () {
  var s = document.getElementById("splash"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  try {
    if (sessionStorage.getItem("lz.splash")) { s.remove(); return; }
    sessionStorage.setItem("lz.splash", "1");
    if ((JSON.parse(localStorage.getItem("dus.v1") || "{}").lang) === "ru") document.getElementById("sp-sub").textContent = "Тесты экзамена DUS";
  } catch (e) { /* depolama kapalıysa animasyon her açılışta oynar */ }
  var gone = false, done = function () { if (gone) return; gone = true; s.classList.add("out"); setTimeout(function () { s.remove(); }, reduce ? 250 : 750); };
  s.addEventListener("click", done);
  setTimeout(done, reduce ? 700 : 2700);
})();
</script>
